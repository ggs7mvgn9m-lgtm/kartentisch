<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartentisch">
<title>Kartentisch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Kartentisch im Heptabase-Stil: graue Arbeitsfläche, schlichte weiße Karten, Seitenleiste mit Ordnerbaum.
   Layout: Seitenleiste | Arbeitsfläche (Whiteboard, Bibliothek, Präsentation) | Kartenpanel rechts */
:root{
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f2f2f4; --hover:#ebebee; --board:#efeff1;
  --text:#1d1d1f; --muted:#6e6e73; --line:#e2e2e6; --conn:#a3a3a8; --thumb:#ececef; --mm-item:#c9c9cf;
  --accent:#2f6fed; --accent-ink:#ffffff; --accent-weak:#e8effd; --danger:#d93a2b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
  --shadow-float:0 2px 6px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.08);
  --shadow-lift:0 4px 10px rgba(0,0,0,.1),0 16px 36px rgba(0,0,0,.14);
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --ink-k:#1d1d1f; --ink-b:#2f6fed; --ink-r:#d93a2b; --ink-g:#1f8a4c; --ink-o:#e07a12; --ink-v:#7d43c8;
  --hl-y:#ffd60a; --hl-g:#6be38a; --hl-p:#ff86cf; --hl-b:#6cc8ff; --hl-opacity:.42; --hl-blend:multiply;
  --card-none:#ffffff; --card-yellow:#fdf5d3; --card-green:#e4f3e7; --card-blue:#e6edfc; --card-rose:#fbe7e7; --card-violet:#efe8fb;
  --stripe-none:#c7c7cc; --stripe-yellow:#e6b800; --stripe-green:#2f9d5c; --stripe-blue:#2f6fed; --stripe-rose:#d8505a; --stripe-violet:#7d43c8;
  --tile-lib:#3a3a3c; --tile-board:#2e9f78; --tile-pres:#ee8a2a; --tile-folder:#8e8e93;
  --ok:#1f8a4c; --warn:#b7791f;
  --sbw:272px; --edw:480px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1e; --surface:#262628; --surface-2:#2c2c2f; --hover:#333336; --board:#19191b;
    --text:#ececef; --muted:#a1a1a7; --line:#3a3a3e; --conn:#77777d; --thumb:#38383c; --mm-item:#55555b;
    --accent:#5b8cff; --accent-ink:#0f1115; --accent-weak:#24304d; --danger:#ff6b5e;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-float:0 2px 6px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35); --shadow-lift:0 4px 10px rgba(0,0,0,.45),0 16px 36px rgba(0,0,0,.5);
    --ink-k:#ececef; --ink-b:#7ea3ff; --ink-r:#ff6b5e; --ink-g:#52d18c; --ink-o:#ffa24a; --ink-v:#bb90ff; --hl-opacity:.32; --hl-blend:normal;
    --card-none:#262628; --card-yellow:#3a3420; --card-green:#1f3328; --card-blue:#1f2a42; --card-rose:#3d2528; --card-violet:#2f2640;
    --stripe-none:#55555b; --stripe-yellow:#e6c33a; --stripe-green:#4cc184; --stripe-blue:#7ea3ff; --stripe-rose:#ff7b86; --stripe-violet:#bb90ff;
    --ok:#52d18c; --warn:#f0b54a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1c1e; --surface:#262628; --surface-2:#2c2c2f; --hover:#333336; --board:#19191b;
  --text:#ececef; --muted:#a1a1a7; --line:#3a3a3e; --conn:#77777d; --thumb:#38383c; --mm-item:#55555b;
  --accent:#5b8cff; --accent-ink:#0f1115; --accent-weak:#24304d; --danger:#ff6b5e;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-float:0 2px 6px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35); --shadow-lift:0 4px 10px rgba(0,0,0,.45),0 16px 36px rgba(0,0,0,.5);
  --ink-k:#ececef; --ink-b:#7ea3ff; --ink-r:#ff6b5e; --ink-g:#52d18c; --ink-o:#ffa24a; --ink-v:#bb90ff; --hl-opacity:.32; --hl-blend:normal;
  --card-none:#262628; --card-yellow:#3a3420; --card-green:#1f3328; --card-blue:#1f2a42; --card-rose:#3d2528; --card-violet:#2f2640;
  --stripe-none:#55555b; --stripe-yellow:#e6c33a; --stripe-green:#4cc184; --stripe-blue:#7ea3ff; --stripe-rose:#ff7b86; --stripe-violet:#bb90ff;
  --ok:#52d18c; --warn:#f0b54a;
  color-scheme:dark;
}
/* Präsentation: standardmäßig hell, weil Beamer dunkle Flächen schlucken */
.present.light{
  --bg:#efeff1; --surface:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:#e2e2e6; --accent:#2f6fed;
  --ink-k:#1d1d1f; --ink-b:#2f6fed; --ink-r:#d93a2b; --ink-g:#1f8a4c; --ink-o:#e07a12; --ink-v:#7d43c8; --hl-opacity:.42; --hl-blend:multiply;
  --card-none:#ffffff; --card-yellow:#fdf5d3; --card-green:#e4f3e7; --card-blue:#e6edfc; --card-rose:#fbe7e7; --card-violet:#efe8fb;
  color-scheme:light;
}
.present.dark{
  --bg:#141416; --surface:#262628; --text:#ececef; --muted:#a1a1a7; --line:#3a3a3e; --accent:#5b8cff;
  --ink-k:#ececef; --ink-b:#7ea3ff; --ink-r:#ff6b5e; --ink-g:#52d18c; --ink-o:#ffa24a; --ink-v:#bb90ff; --hl-opacity:.32; --hl-blend:normal;
  --card-none:#262628; --card-yellow:#3a3420; --card-green:#1f3328; --card-blue:#1f2a42; --card-rose:#3d2528; --card-violet:#2f2640;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:block;flex:none}

.app{height:100%;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.app.sb-collapsed{grid-template-columns:0 minmax(0,1fr) auto}
.app.sb-collapsed .sidebar{visibility:hidden}

/* ---------- Seitenleiste ---------- */
.sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);border-right:1px solid var(--line);overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 14px;font-weight:700;font-size:15px}
.brand .logo{width:22px;height:22px;flex:none}
.brand .grow{flex:1}
.sb-top{padding:0 8px 6px;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:transparent;text-align:left;min-height:38px;font-size:15px}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--hover);font-weight:600}
.nav-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count,.tree-row .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.t-lib{background:var(--tile-lib)} .t-board{background:var(--tile-board)} .t-pres{background:var(--tile-pres)}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 8px 12px;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.nav-head{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 4px 8px;font-size:13.5px;color:var(--muted)}
.nh-actions{display:flex;gap:2px}
.mini-btn{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:var(--muted)}
.mini-btn:hover{background:var(--hover);color:var(--text)}
.tree-row{display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:14.5px;-webkit-user-select:none;user-select:none}
.tree-row:hover{background:var(--hover)}
.tree-row.active{background:var(--hover);font-weight:600}
.tree-row.bold{font-weight:600}
.tree-row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .tr-ic{color:var(--muted);display:grid;place-items:center}
.tree-row .tr-ic.board{color:var(--tile-board)} .tree-row .tr-ic.pres{color:var(--tile-pres)}
.chev{width:18px;height:18px;border:0;padding:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:4px;flex:none;transition:transform .12s}
.chev.open{transform:rotate(90deg)}
.chev:hover{background:var(--line)}
.chev-sp{width:18px;flex:none}
.tr-more{width:26px;height:26px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0;flex:none}
.tree-row:hover .tr-more,.tree-row:focus-within .tr-more{opacity:1}
@media (hover:none){.tr-more{opacity:.6}}
.tr-more:hover{background:var(--line);color:var(--text)}
.empty-note{padding:6px 10px;color:var(--muted);font-size:13px}
.sb-foot{border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.foot-row{display:flex;gap:8px}
.foot-row .btn{flex:1}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .dot{background:var(--ok)}
.sync.busy .dot{background:var(--accent);animation:pulse 1s infinite}
.sync.warn .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.scrim{display:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger)}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;flex:none;color:var(--text)}
.icon-btn:hover{background:var(--hover)}
.icon-btn.active{background:var(--accent-weak);color:var(--accent)}
.icon-btn:disabled{opacity:.3;pointer-events:none}
.sb-open{display:none}
.app.sb-collapsed .sb-open{display:grid}

/* ---------- Kopfzeile mit Pfad ---------- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.view-head{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);min-height:52px}
.view-head .grow{flex:1;min-width:0}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;font-size:16px}
.crumb-ic{color:var(--muted);flex:none}
.crumb{border:0;background:transparent;padding:4px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;font-size:16px}
button.crumb:hover{background:var(--hover)}
.crumb.muted{color:var(--muted)}
.crumb-sep{color:var(--line);font-size:18px;flex:none}
.crumb-input{border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 6px;font-size:16px;font-weight:600;min-width:60px;max-width:100%;field-sizing:content}
.crumb-input:hover{border-color:var(--line)}
.crumb-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.title-input{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 6px;font-weight:600;font-size:16px;min-width:0;text-overflow:ellipsis}
.title-input:hover{border-color:var(--line)}
.title-input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.loading{display:grid;place-items:center;flex:1;color:var(--muted)}

/* ---------- Whiteboard ---------- */
.vp-wrap{position:relative;flex:1;min-height:0;overflow:hidden}
.viewport{position:absolute;inset:0;overflow:hidden;background:var(--board);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
.viewport.tool-pen,.viewport.tool-hl{cursor:crosshair}
.viewport.tool-eraser{cursor:cell}
.viewport.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer-svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.arrow-line{fill:none;stroke:var(--conn);stroke-width:1.6;stroke-linecap:round}
.arrow-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.arrow.sel .arrow-line{stroke:var(--accent);stroke-width:2.4}
.hl{fill:none;opacity:var(--hl-opacity);mix-blend-mode:var(--hl-blend);stroke-linecap:round;stroke-linejoin:round}

.bitem{position:absolute;left:0;top:0;border-radius:8px;background:var(--card-none);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;cursor:default}
.bitem.sel{outline:2px solid var(--accent);outline-offset:1px}
.bitem.dragging{box-shadow:var(--shadow-lift)}
.bitem.connect-src{outline:2px dashed var(--accent);outline-offset:3px}
.bitem.auto{max-height:520px}
.bitem.editing{max-height:none;outline:2px solid var(--accent);outline-offset:1px;box-shadow:var(--shadow-float);overflow:visible}
.bitem.editing .bc-body{overflow:auto;height:100%}
.bitem .cc{padding:12px 14px 12px;pointer-events:none}
.bitem.clip .fade{position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(transparent,var(--cardbg,var(--card-none)));pointer-events:none;border-radius:0 0 8px 8px}
.bcard-resize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;z-index:2}
.bcard-resize::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);opacity:0;transition:opacity .12s}
.bitem:hover .bcard-resize::after,.bitem.sel .bcard-resize::after{opacity:.6}
@media (hover:none){.bitem.sel .bcard-resize::after{opacity:.7}}
.c-yellow{--cardbg:var(--card-yellow);background:var(--card-yellow)}
.c-green{--cardbg:var(--card-green);background:var(--card-green)}
.c-blue{--cardbg:var(--card-blue);background:var(--card-blue)}
.c-rose{--cardbg:var(--card-rose);background:var(--card-rose)}
.c-violet{--cardbg:var(--card-violet);background:var(--card-violet)}

/* Karte direkt auf dem Board bearbeiten */
.ie{padding:12px 14px 14px;-webkit-user-select:text;user-select:text;cursor:text;-webkit-touch-callout:default}
.ie > * + *{margin-top:8px}
.ie-title{display:block;width:100%;border:0;background:transparent;padding:0;font-weight:700;font-size:15px;line-height:1.3;outline:none}
.ie-title::placeholder{color:var(--muted);font-weight:600}
.ie-text{min-height:1.5em;outline:none;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.ie-text:empty::before{content:attr(data-ph);color:var(--muted)}
.ie-note{font-size:12px;color:var(--muted)}
.bc-grip{position:absolute;left:0;right:0;top:-1px;height:12px;cursor:move;touch-action:none;z-index:2}
.bc-grip::after{content:"";position:absolute;left:50%;top:3px;width:30px;height:4px;margin-left:-15px;border-radius:2px;background:var(--line)}
.ie-expand{position:absolute;top:6px;right:6px;width:28px;height:28px;background:var(--surface);border:1px solid var(--line);z-index:3}

/* Unter-Whiteboard als Kachel */
.bb{padding:10px 12px 10px;pointer-events:none}
.bb-head{display:flex;align-items:center;gap:8px}
.bb-head .tile{width:24px;height:24px;border-radius:6px}
.bb-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-thumb{display:block;width:100%;height:96px;margin-top:10px;border-radius:6px;background:var(--surface-2)}
.bb-thumb rect{fill:var(--thumb);stroke:var(--line);stroke-width:1}
.bb-meta{margin-top:8px;font-size:12px;color:var(--muted)}

/* Karteninhalt (Board, Bibliothek, Präsentation) */
.cc-title{font-weight:700;font-size:15px;line-height:1.3;margin:0 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.cc-title.empty{color:var(--muted);font-weight:600}
.cc-text{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.cc-text > :first-child,.ed-text > :first-child,.ie-text > :first-child{margin-top:0}
.cc-text > :last-child,.ed-text > :last-child,.ie-text > :last-child{margin-bottom:0}
.cc-text h1,.cc-text h2,.cc-text h3,.ed-text h1,.ed-text h2,.ed-text h3,.ie-text h1,.ie-text h2,.ie-text h3{font-size:1.12em;margin:.6em 0 .25em;line-height:1.25}
.cc-text p,.ed-text p,.ie-text p{margin:.35em 0}
.cc-text ul,.cc-text ol,.ed-text ul,.ed-text ol,.ie-text ul,.ie-text ol{margin:.35em 0;padding-left:1.3em}
.cc > * + *{margin-top:8px}
.cc-ink{display:block;width:100%;height:auto;overflow:visible}
.cc-img{display:block;max-width:100%;border-radius:6px}

/* Werkzeugleiste links, Stift-Optionen, Zoom, Minikarte */
.vtool{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-float);z-index:5;max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:none}
.vtool::-webkit-scrollbar{display:none}
.vtool .icon-btn{width:40px;height:40px;border-radius:10px}
.vtool .icon-btn.active{background:var(--accent-weak);color:var(--accent)}
.vsep{width:24px;height:1px;background:var(--line);margin:4px 0;flex:none}
.vflyout{position:absolute;display:flex;align-items:center;gap:2px;padding:5px 6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-float);transform:translateY(-50%);z-index:6}
.tb-sep{width:1px;align-self:stretch;margin:4px 4px;background:var(--line);flex:none}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;background:transparent;flex:none;padding:0}
.swatch i{display:block;width:18px;height:18px;border-radius:50%}
.swatch.active{border-color:var(--text)}
.size{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;flex:none;padding:0}
.size i{display:block;border-radius:50%;background:var(--text)}
.size.active{background:var(--accent-weak)}
.zoombar{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:0;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-float);z-index:5}
.zoombar .icon-btn{width:32px;height:32px}
.zoombar .pct{min-width:50px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;border:0;background:transparent;padding:6px 2px;border-radius:7px}
.minimap{position:absolute;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));width:190px;height:124px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-float);overflow:hidden;z-index:5;cursor:pointer;touch-action:none}
.mm-canvas{display:block;width:100%;height:100%}
.selbar{position:absolute;display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lift);z-index:7;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.selbar .btn{min-height:30px;padding:4px 9px;border-color:transparent;font-size:13px;font-weight:500}
.selbar .btn:hover{background:var(--hover)}
.selbar .swatch{width:26px;height:26px}
.selbar .swatch i{width:16px;height:16px;border:1px solid var(--line)}
.board-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:340px;padding:0 16px}
.board-hint b{display:block;font-size:17px;color:var(--text);margin-bottom:4px}

/* ---------- Bibliothek ---------- */
.lib-tools{display:flex;gap:8px;align-items:center}
.search{min-width:0;width:240px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:6px 11px}
.search:focus{outline:none;border-color:var(--accent)}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px calc(24px + env(safe-area-inset-bottom));background:var(--board)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lcard{position:relative;display:flex;flex-direction:column;height:240px;border-radius:8px;border:1px solid var(--line);background:var(--card-none);box-shadow:var(--shadow);overflow:hidden;text-align:left;padding:0;cursor:pointer}
.lcard:hover{box-shadow:var(--shadow-float)}
.lcard .cc{flex:1;min-height:0;overflow:hidden;padding:12px 14px 0;position:relative}
.lcard .cc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--cardbg,var(--card-none)))}
.lmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip.lone{color:var(--warn);border-color:currentColor;background:transparent}
.lib-empty{color:var(--muted);text-align:center;padding:60px 20px}

/* ---------- Präsentations-Editor ---------- */
.pres-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr)}
.slides-col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.slides-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;font-size:13px;color:var(--muted)}
.slides{list-style:none;margin:0;padding:0 8px 8px;overflow-y:auto;flex:1;touch-action:pan-y}
.slide-row{display:flex;align-items:center;gap:6px;padding:6px;border-radius:8px;border:1px solid transparent;background:var(--surface);cursor:pointer;min-height:46px}
.slide-row:hover{background:var(--hover)}
.slide-row.active{border-color:var(--accent);background:var(--accent-weak)}
.slide-row.dragging{box-shadow:var(--shadow-lift);position:relative;z-index:2;background:var(--surface)}
.slide-row .grip{display:grid;place-items:center;width:28px;height:36px;color:var(--muted);cursor:grab;touch-action:none;flex:none}
.slide-row .num{width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;flex:none}
.slide-row .sw{width:6px;height:26px;border-radius:3px;background:var(--stripe-none);flex:none}
.slide-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.slide-row .icon-btn{width:30px;height:30px}
.slides-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.preview-col{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;background:var(--board)}
.preview-frame{position:relative;width:100%;max-width:900px;aspect-ratio:16/10;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.preview-note{color:var(--muted);font-size:13px;text-align:center}

/* ---------- Präsentationsmodus ---------- */
.present{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:none}
.stage{position:absolute;inset:0;overflow:hidden}
.stage.scrolly{overflow-y:auto;touch-action:pan-y}
.slide-holder{position:relative;margin:0 auto}
.slide{position:absolute;left:0;top:0;width:960px;transform-origin:0 0;border-radius:16px;background:var(--card-none);box-shadow:var(--shadow-float);border:1px solid var(--line);overflow:hidden}
.slide .cc{padding:48px 56px 52px;font-size:26px;line-height:1.45}
.slide .cc-title{font-size:44px;margin-bottom:22px;letter-spacing:-.01em}
.slide .cc-text{font-size:26px}
.slide .cc > * + *{margin-top:22px}
.slide .cc-img{border-radius:10px;margin-left:auto;margin-right:auto}
.p-ui{position:absolute;display:flex;align-items:center;gap:6px;transition:opacity .25s;z-index:2}
.present.idle .p-ui{opacity:0;pointer-events:none}
.p-top{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
.p-bottom{bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow-float)}
.p-count{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.p-top .icon-btn{background:var(--surface);border:1px solid var(--line)}
.p-progress{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s;z-index:2}
.p-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:20px}

/* ---------- Kartenpanel rechts ---------- */
.editor{width:var(--edw);border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.ed-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);min-height:52px}
.ed-head .grow{flex:1}
.ed-colors{display:flex;gap:2px}
.ed-colors .swatch{width:28px;height:28px}
.ed-colors .swatch i{width:16px;height:16px;border:1px solid var(--line)}
.ed-tools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ed-tools .icon-btn{width:34px;height:34px}
.fmt{font-weight:700;font-size:15px;width:34px;height:34px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.fmt:hover{background:var(--hover)}
.ed-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(28px + env(safe-area-inset-bottom))}
.ed-title{width:100%;border:0;background:transparent;font-weight:700;font-size:24px;line-height:1.25;padding:4px 0 10px;outline:none}
.ed-title::placeholder{color:var(--muted);opacity:.7}
.ed-blocks{display:flex;flex-direction:column;gap:10px}
.blk{position:relative;border-radius:8px}
.blk-ctrl{position:absolute;top:-14px;right:4px;display:flex;gap:2px;padding:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-float);opacity:0;pointer-events:none;transition:opacity .12s;z-index:2}
.blk:hover .blk-ctrl,.blk:focus-within .blk-ctrl,.blk.active .blk-ctrl{opacity:1;pointer-events:auto}
.blk-ctrl .icon-btn{width:28px;height:28px}
.ed-text{min-height:1.6em;padding:6px 8px;border-radius:8px;outline:none;font-size:15.5px;line-height:1.55;-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.ed-text:focus{background:var(--surface-2)}
.ed-text:empty::before{content:attr(data-ph);color:var(--muted);opacity:.75}
.blk-ink{position:relative;border:1px solid var(--line);border-radius:8px;background-color:var(--board);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;background-position:0 31px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;cursor:crosshair}
body.finger-draw .blk-ink{touch-action:none}
.blk-ink svg{display:block;width:100%;height:auto}
.ink-grow{display:flex;justify-content:center;align-items:center;height:22px;border-top:1px dashed var(--line);color:var(--muted);font-size:12px;cursor:ns-resize;touch-action:none;background:var(--surface)}
.blk-img img{display:block;max-width:100%;border-radius:8px}
.ed-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ed-meta{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.ed-meta .links{display:flex;flex-wrap:wrap;gap:6px}
.ed-meta .chip{cursor:pointer}
.ed-meta .chip:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- Modale, Menüs, Hinweise ---------- */
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.32);display:grid;place-items:center;padding:16px}
.modal{width:min(500px,100%);max-height:min(640px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lift);border:1px solid var(--line);overflow:hidden}
.modal h2{font-size:17px;margin:0;padding:16px 18px 10px;text-wrap:balance}
.modal p{margin:0;padding:0 18px 8px;color:var(--muted)}
.modal .m-body{flex:1;min-height:0;overflow-y:auto;padding:4px 10px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.modal .search{width:auto;margin:0 18px 8px}
.modal .m-input{display:block;width:calc(100% - 36px);margin:0 18px 12px;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--surface-2)}
.modal .m-input:focus{outline:none;border-color:var(--accent)}
.pick-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;min-height:44px}
.pick-row:hover{background:var(--hover)}
.pick-row.on{background:var(--accent-weak)}
.pick-row .sw{width:6px;height:28px;border-radius:3px;background:var(--stripe-none);flex:none}
.pick-row .tt{flex:1;min-width:0}
.pick-row .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pick-row .tt small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-row .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.pick-row.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.menu{position:fixed;z-index:90;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lift);padding:4px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:8px 12px;border-radius:7px;text-align:left;min-height:38px}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Schmale Bildschirme ---------- */
@media (max-width: 1099px){
  .editor{position:fixed;inset:0;z-index:40;width:auto;border-left:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .app{grid-template-columns:var(--sbw) minmax(0,1fr)}
  .app.sb-collapsed{grid-template-columns:0 minmax(0,1fr)}
}
@media (max-width: 859px){
  .app,.app.sb-collapsed{grid-template-columns:minmax(0,1fr)}
  .app.sb-collapsed .sidebar{visibility:visible}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow-lift);padding-top:env(safe-area-inset-top)}
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sb-open{display:grid}
  .view-head{padding:6px 8px}
  .hide-narrow{display:none}
  .crumb.muted,.crumb-sep.fold{display:none}
  .pres-body{grid-template-columns:minmax(0,1fr)}
  .preview-col{display:none}
  .slides-col{border-right:0}
  .search{width:100%}
  .lib-tools{flex:1}
  .scroll-area{padding:14px}
  .lib-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .lcard{height:210px}
  .minimap{display:none}
  .vtool{left:8px;padding:4px}
  .vtool .icon-btn{width:36px;height:36px}
  .slide .cc{padding:40px 40px 44px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

/* ---------- Bausteine ---------- */
:root{ --sec-none:rgba(0,0,0,.035); --sec-yellow:rgba(230,184,0,.12); --sec-green:rgba(47,157,92,.10); --sec-blue:rgba(47,111,237,.09); --sec-rose:rgba(216,80,90,.10); --sec-violet:rgba(125,67,200,.10); --mm-sec:#e4e4e8; --tile-search:#6e6e73 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sec-none:rgba(255,255,255,.04); --sec-yellow:rgba(230,195,58,.10); --sec-green:rgba(76,193,132,.09); --sec-blue:rgba(126,163,255,.09); --sec-rose:rgba(255,123,134,.09); --sec-violet:rgba(187,144,255,.09); --mm-sec:#333337 } }
:root[data-theme="dark"]{ --sec-none:rgba(255,255,255,.04); --sec-yellow:rgba(230,195,58,.10); --sec-green:rgba(76,193,132,.09); --sec-blue:rgba(126,163,255,.09); --sec-rose:rgba(255,123,134,.09); --sec-violet:rgba(187,144,255,.09); --mm-sec:#333337 }
.t-search{background:var(--tile-search)}
.count.kbd{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.cc-text h1,.ed-text h1,.ie-text h1{font-size:1.45em} .cc-text h2,.ed-text h2,.ie-text h2{font-size:1.22em} .cc-text h3,.ed-text h3,.ie-text h3{font-size:1.06em}
.cc-text blockquote,.ed-text blockquote,.ie-text blockquote{margin:.4em 0;padding:.05em 0 .05em .8em;border-left:3px solid var(--conn);color:var(--muted)}
a.clink{color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:0 4px;text-decoration:none;cursor:pointer;font-weight:500}
a.clink::before{content:"↗ ";font-size:.85em}
a.clink.missing{color:var(--muted);background:var(--surface-2);text-decoration:line-through;cursor:default}
.cc-hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.todo li{display:flex;align-items:flex-start;gap:8px}
.todo .chk{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center;background:transparent;padding:0;color:#fff}
.todo li.done .chk{background:var(--accent);border-color:var(--accent)}
.todo li.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .tt{flex:1;min-width:0;outline:none;min-height:1.4em;overflow-wrap:anywhere}
.todo.edit{font-size:inherit}
.todo .tt:empty::before{content:attr(data-ph);color:var(--muted)}
.tgl-head{display:flex;align-items:flex-start;gap:4px}
.tgl-arrow{width:22px;height:22px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:5px;transition:transform .12s;padding:0;cursor:pointer}
.tgl-arrow:hover{background:var(--hover)}
.tgl.open .tgl-arrow{transform:rotate(90deg)}
.tgl-title{flex:1;min-width:0;font-weight:600;outline:none;min-height:1.4em;padding-top:1px;overflow-wrap:anywhere}
.tgl-title:empty::before{content:attr(data-ph);color:var(--muted);font-weight:500}
.tgl-body{margin-left:26px}
.tgl:not(.open) .tgl-body{display:none}
.file-tile,.link-tile,.embed-tile{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
a.file-tile:hover,a.link-tile:hover,a.embed-tile:hover{border-color:var(--accent)}
.fi-ic{width:32px;height:38px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--muted);flex:none}
.lt-ic{width:32px;height:32px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none}
.embed-tile .play{width:40px;height:40px;border-radius:50%;background:#e62117;color:#fff;display:grid;place-items:center;flex:none}
.ft-text{min-width:0;flex:1}
.ft-text b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13.5px}
.ft-text small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.cc-video{display:block;width:100%;border-radius:8px;background:#000;max-height:520px}
.cc-audio{display:block;width:100%}
.audio-wrap{display:flex;flex-direction:column;gap:4px}
.audio-name{font-size:12.5px;color:var(--muted)}
.embed{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.missing-file{opacity:.4}
.slide .file-tile,.slide .link-tile,.slide .embed-tile{padding:16px 18px;border-radius:12px}
.slide .ft-text b{font-size:24px} .slide .ft-text small{font-size:18px}
.slide .embed-tile .play{width:64px;height:64px}
.slide .todo{font-size:26px;gap:10px} .slide .todo .chk{width:26px;height:26px;margin-top:6px}
.slide .tgl-head{cursor:pointer} .slide .tgl-arrow{width:34px;height:34px;margin-top:3px}
.slide .tgl-title{font-weight:700}
.slide .tgl-body{margin-left:38px}
.ed-tip{font-size:12.5px;color:var(--muted);align-self:center}
.ed-blocks .blk-divider{padding:6px 0}
.slash-menu{position:fixed;z-index:95;width:280px;max-height:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lift);padding:4px}
.slash-head{padding:6px 8px 4px;font-size:12px;color:var(--muted)}
.slash-item{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;border:0;border-radius:7px;background:transparent;text-align:left;font-size:14px;min-height:38px}
.slash-item.on,.slash-item:hover{background:var(--hover)}
.si-ic{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.slash-item small{margin-left:auto;color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.ie .ed-blocks{gap:6px}
.ie .blk-ctrl{top:-12px}
.ie .blk-ink{border-radius:6px}
.ie .ed-text,.ie .ie-text{padding:0;font-size:13.5px}
.ie .ed-text:focus{background:transparent}
/* Abschnitte */
.bsec{position:absolute;left:0;top:0;border-radius:12px;background:var(--sb,var(--sec-none));border:1px solid var(--line);pointer-events:none}
.bsec.s-yellow{--sb:var(--sec-yellow)} .bsec.s-green{--sb:var(--sec-green)} .bsec.s-blue{--sb:var(--sec-blue)} .bsec.s-rose{--sb:var(--sec-rose)} .bsec.s-violet{--sb:var(--sec-violet)}
.bsec.sel{outline:2px solid var(--accent);outline-offset:1px}
.bsec-title{position:absolute;left:4px;bottom:100%;margin-bottom:4px;max-width:100%;height:26px;display:flex;align-items:center;padding:0 8px;font-weight:600;font-size:15px;color:var(--muted);cursor:move;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px;pointer-events:auto;touch-action:none}
.bsec-title:hover{background:var(--hover);color:var(--text)}

// ---------- Lokaler Zwischenspeicher (IndexedDB, sonst localStorage) ----------
const LocalCache = {
  idb: null, ls: false,
  async open() {
    try {
      this.idb = await Promise.race([
        new Promise((res, rej) => {
          const r = indexedDB.open('kartentisch', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('ents', { keyPath: 'key' });
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        }),
        sleep(2500).then(() => { throw new Error('timeout'); })
      ]);
    } catch (e) {
      this.idb = null;
      try { localStorage.setItem('kt-probe', '1'); localStorage.removeItem('kt-probe'); this.ls = true; } catch (e2) { this.ls = false; }
    }
  },
  async loadAll() {
    if (this.idb) {
      return new Promise(res => {
        try { const req = this.idb.transaction('ents', 'readonly').objectStore('ents').getAll(); req.onsuccess = () => res(req.result || []); req.onerror = () => res([]); }
        catch (e) { res([]); }
      });
    }
    if (this.ls) {
      const out = [];
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('kt:')) { try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) {} } } } catch (e) {}
      return out;
    }
    return [];
  },
  async putMany(recs) {
    if (!recs.length) return;
    if (this.idb) {
      await new Promise(res => {
        try { const tx = this.idb.transaction('ents', 'readwrite'); const st = tx.objectStore('ents'); for (const r of recs) st.put(r); tx.oncomplete = res; tx.onerror = res; tx.onabort = res; }
        catch (e) { res(); }
      });
    } else if (this.ls) {
      for (const r of recs) { try { localStorage.setItem('kt:' + r.key, JSON.stringify(r)); } catch (e) { /* voll */ } }
    }
  }
};
function recordFor(key) {
  const e = entityByKey(key);
  if (e) return { key, v: e.v, j: JSON.stringify(ser(e)) };
  return { key, v: S.tomb.get(key) || stamp(), d: true };
}
function applyRecord(r) {
  if (!r || typeof r.key !== 'string' || !/^[cbpf]_/.test(r.key)) return;
  if ((r.v || 0) <= localV(r.key)) return;
  if (r.d) { removeEntityLocal(r.key, r.v); return; }
  try { const e = deser(JSON.parse(r.j)); if (e && keyOf(e) === r.key) { e.v = r.v; setEntity(e); } } catch (e) {}
}

// ---------- Cloud-Synchronisierung (claude.ai-Datenbank, privat pro Person) ----------
const Persist = {
  mode: 'loading', db: null, userId: null, coll: null, unsub: null,
  dirty: new Set(), localDirty: new Set(), flushing: false, timer: null,
  remoteV: new Map(), remoteN: new Map(), merged: false, reachable: true,
  mark(key) { this.dirty.add(key); this.localDirty.add(key); this.schedule(); updateSync(); },
  schedule(ms = 700) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async flush() {
    const lk = Array.from(this.localDirty); this.localDirty.clear();
    await LocalCache.putMany(lk.map(recordFor));
    if (this.mode !== 'cloud' || !this.merged || this.flushing) { updateSync(); return; }
    this.flushing = true; updateSync();
    try {
      while (this.dirty.size && this.mode === 'cloud') {
        if (this.driver === 'supa' && this.dirty.size > 2) {
          const keys = [...this.dirty].slice(0, 150); keys.forEach(k => this.dirty.delete(k));
          try { await Supa.writeMany(keys); this.reachable = true; } catch (err) { keys.forEach(k => this.dirty.add(k)); this.reachable = false; updateSync(); await sleep(2500 + Math.random() * 2000); }
          continue;
        }
        const key = this.dirty.values().next().value; this.dirty.delete(key);
        try { await this.writeKey(key); this.reachable = true; }
        catch (err) {
          const code = err && err.code;
          this.dirty.add(key);
          if (code === 'unavailable' || code === 'resource_exhausted' || !code) { this.reachable = false; updateSync(); await sleep(2000 + Math.random() * 2000); }
          else if (code === 'quota_exceeded') { toast('Der Cloud-Speicher ist voll. Lösche große Bilder oder Karten, dann wird weiter synchronisiert.'); break; }
          else { this.goLocal('denied'); break; }
        }
      }
    } finally { this.flushing = false; updateSync(); if (this.dirty.size && this.mode === 'cloud') this.schedule(4000); }
  },
  async writeKey(key) {
    if (this.driver === 'supa') return Supa.writeKey(key);
    const e = entityByKey(key);
    const coll = this.coll;
    const oldN = this.remoteN.get(key) || 1;
    if (!e) {
      const v = S.tomb.get(key) || stamp();
      await coll.doc(key).set({ k: key.slice(0, 1), v, d: true, n: 1 });
      for (let i = 1; i < oldN; i++) await coll.doc(key + '~' + i).delete();
      this.remoteV.set(key, v); this.remoteN.set(key, 1);
      return;
    }
    const v = e.v; const json = JSON.stringify(ser(e));
    const parts = []; for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
    if (!parts.length) parts.push('');
    for (let i = 1; i < parts.length; i++) await coll.doc(key + '~' + i).set({ j: parts[i], v });
    await coll.doc(key).set({ k: key.slice(0, 1), v, n: parts.length, j: parts[0] });
    for (let i = parts.length; i < oldN; i++) await coll.doc(key + '~' + i).delete();
    this.remoteV.set(key, v); this.remoteN.set(key, parts.length);
  },
  onSnap(snap) {
    const byId = new Map();
    for (const d of snap.docs) if (d.exists) byId.set(d.id, d.data());
    const changed = new Set();
    for (const [id, body] of byId) {
      if (id.includes('~') || !/^[cbpf]_/.test(id) || !body) continue;
      const rv = num(body.v, 0); this.remoteV.set(id, rv); this.remoteN.set(id, num(body.n, 1));
      if (rv <= localV(id)) continue;
      if (body.d) { removeEntityLocal(id, rv); this.localDirty.add(id); changed.add(id); continue; }
      const n = num(body.n, 1); const parts = [str(body.j, CHUNK + 10)]; let ok = true;
      for (let i = 1; i < n; i++) { const c = byId.get(id + '~' + i); if (!c || c.v !== rv || typeof c.j !== 'string') { ok = false; break; } parts.push(c.j); }
      if (!ok) continue;
      try { const e = deser(JSON.parse(parts.join(''))); if (e && keyOf(e) === id) { e.v = rv; setEntity(e); this.localDirty.add(id); changed.add(id); } } catch (err) {}
    }
    if (!snap.metadata.fromCache) {
      this.reachable = true;
      if (!this.merged) {
        this.merged = true;
        const all = [...S.cards.values(), ...S.boards.values(), ...S.pres.values(), ...S.folders.values()];
        for (const e of all) { const k = keyOf(e); if (e.v > (this.remoteV.get(k) || 0)) this.dirty.add(k); }
        for (const [k, v] of S.tomb) if (v > (this.remoteV.get(k) || 0)) this.dirty.add(k);
        if (isEmptyStore()) seedExamples();
        this.schedule(300);
        onDataChanged(null);
        return;
      }
    }
    if (changed.size) { this.schedule(300); onDataChanged(changed); }
    updateSync();
  },
  goLocal(reason) {
    if (this.unsub) { try { this.unsub(); } catch (e) {} this.unsub = null; }
    const first = this.mode === 'loading' || this.mode === 'signedout';
    this.mode = 'local'; this.localReason = reason;
    if (first && isEmptyStore()) seedExamples();
    if (reason === 'denied') toast('Speichern in der Cloud wurde abgelehnt. Deine Änderungen bleiben auf diesem Gerät.');
    onDataChanged(null); updateSync();
  }
};
function isEmptyStore() { return !S.cards.size && !S.boards.size && !S.pres.size && !S.folders.size && !S.tomb.size; }

async function connectCloud() {
  let api = null;
  for (let i = 0; i < (window.top !== window.self ? 30 : 2) && !api; i++) { if (window.claude && typeof window.claude.use === 'function') api = window.claude; else await sleep(100); }
  if (!api) { HOST.claude = false; if (Supa.available()) { Supa.start(); return; } Persist.goLocal('nohost'); return; }
  HOST.claude = true;
  let db = null, user = null, uid = null;
  try { [db, user, Files.assets] = await Promise.all([api.use('db'), api.use('user'), Promise.resolve(api.use('assets')).catch(() => null)]); } catch (e) {}
  try { uid = user ? await user.id() : null; } catch (e) {}
  if (!db || !uid) { Persist.goLocal('nouser'); return; }
  Persist.db = db; Persist.userId = uid; Persist.mode = 'cloud';
  try { Persist.coll = db.collection('data/users/' + uid); } catch (e) { Persist.goLocal('nouser'); return; }
  updateSync();
  const timer = setTimeout(() => { if (!Persist.merged) { Persist.reachable = false; updateSync(); if (!S.boards.size) onDataChanged(null); } }, 10000);
  Persist.unsub = Persist.coll.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    Persist.onSnap(snap);
  }, err => {
    clearTimeout(timer);
    if (err && err.code === 'unavailable') { Persist.reachable = false; updateSync(); setTimeout(() => { Persist.mode = 'loading'; connectCloud(); }, 5000); }
    else Persist.goLocal('error');
  });
}

function updateSync() {
  const el = $('#sync'), tx = $('#syncText'); if (!el) return;
  el.className = 'sync';
  const pending = Persist.dirty.size > 0 || Persist.flushing;
  if (Persist.mode === 'loading') { tx.textContent = 'Verbinde …'; el.classList.add('busy'); }
  else if (Persist.mode === 'signedout') { tx.textContent = 'Nicht angemeldet'; el.classList.add('warn'); }
  else if (Persist.mode === 'local') {
    tx.textContent = Persist.localReason === 'chosen' ? 'Ohne Konto: nur auf diesem Gerät' : Persist.localReason === 'nohost' ? 'Nur auf diesem Gerät gespeichert' : Persist.localReason === 'nouser' ? 'Nicht angemeldet: nur auf diesem Gerät' : 'Nur auf diesem Gerät gespeichert';
    el.classList.add('warn');
  }
  else if (!Persist.merged || !Persist.reachable) { tx.textContent = Persist.merged ? 'Offline: wird später synchronisiert' : 'Lade aus der Cloud …'; el.classList.add(Persist.merged ? 'warn' : 'busy'); }
  else if (pending) { tx.textContent = 'Speichert …'; el.classList.add('busy'); }
  else { tx.textContent = 'Synchronisiert'; el.classList.add('ok'); }
}

const INK_BGS = [['none', 'Leer'], ['lines', 'Liniert'], ['wide', 'Liniert, weit'], ['grid', 'Kariert'], ['dots', 'Punkte']];

const snapOf = key => { const e = entityByKey(key); return e ? JSON.stringify(ser(e)) : null; };

  begin(keys) { return { items: [...new Set(keys)].map(key => ({ key, before: snapOf(key) })) }; },
  end(tok) {

  // --- Zeiger-Ereignisse ---
  bindEvents() {

  onDown(e) {

async function deleteBoard(b) {

  const ok = await confirmDialog(`„${b.name || 'Ohne Namen'}“ löschen?`, 'Die Karten bleiben in der Bibliothek.' + (kids.length ? ` ${kids.length === 1 ? 'Das Unter-Whiteboard bleibt' : 'Die ' + kids.length + ' Unter-Whiteboards bleiben'} erhalten und rücken eine Ebene nach oben.` : ''), 'Whiteboard löschen');

  } else onDataChanged(null);

function mediaBlocks(card) { return card.blocks.filter(b => ['image', 'file', 'video', 'audio'].includes(b.type) && (b.asset || b.local || b.sb)); }

async function blobForBlock(b) {

}

    const reachable = (b.asset && HOST.claude) || (b.sb && Supa.user) ; if (reachable) continue;
    try {
      const blob = await (await fetch(f.data)).blob();
      const file = new File([blob], f.name || b.name || 'datei', { type: f.type || blob.type });
      const nb = await Files.toBlock(file);
      for (const k of ['asset', 'sb', 'local', 'src']) delete b[k];
      for (const k of ['asset', 'sb', 'local', 'src']) if (nb[k]) b[k] = nb[k];

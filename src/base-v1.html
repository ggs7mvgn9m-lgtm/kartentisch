<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartentisch">
<title>Kartentisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
/* Kartentisch: königsblaue Tinte auf kühlem Papier.
   Layout: Seitenleiste | Arbeitsfläche (Board, Bibliothek, Präsentation) | Kartenpanel rechts */
:root{
  --bg:#e8ecf3; --surface:#ffffff; --surface-2:#f3f5f9; --board:#f8f9fc; --grid:#cad2e0;
  --text:#18202e; --muted:#5a667b; --line:#d5dbe6; --accent:#2445c4; --accent-ink:#ffffff; --accent-weak:#e1e7fb; --danger:#bf342b;
  --shadow:0 1px 2px rgba(20,30,60,.07),0 8px 22px rgba(20,30,60,.08);
  --shadow-lift:0 2px 4px rgba(20,30,60,.1),0 16px 36px rgba(20,30,60,.16);
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --ink-k:#18202e; --ink-b:#2445c4; --ink-r:#d1342b; --ink-g:#18864b; --ink-o:#de7410; --ink-v:#7a3fc4;
  --hl-y:#ffd60a; --hl-g:#6be38a; --hl-p:#ff86cf; --hl-b:#6cc8ff; --hl-opacity:.42; --hl-blend:multiply;
  --card-none:#ffffff; --card-yellow:#fff4c4; --card-green:#ddf2e2; --card-blue:#dde7fc; --card-rose:#fbdfdf; --card-violet:#ebe2fa;
  --stripe-none:#c3cbd9; --stripe-yellow:#e6b800; --stripe-green:#2f9d5c; --stripe-blue:#2445c4; --stripe-rose:#d8505a; --stripe-violet:#7a3fc4;
  --ok:#1f8a4c; --warn:#b7791f;
  --sbw:264px; --edw:480px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#181d26; --surface-2:#1f252f; --board:#13171e; --grid:#2a3140;
    --text:#e6eaf2; --muted:#9aa5b9; --line:#2c3442; --accent:#859dff; --accent-ink:#0e1117; --accent-weak:#232c49; --danger:#ff7b70;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); --shadow-lift:0 2px 4px rgba(0,0,0,.45),0 16px 36px rgba(0,0,0,.5);
    --ink-k:#e6eaf2; --ink-b:#8ea4ff; --ink-r:#ff6d62; --ink-g:#52d18c; --ink-o:#ffa24a; --ink-v:#bb90ff;
    --hl-opacity:.32; --hl-blend:normal;
    --card-none:#181d26; --card-yellow:#36301a; --card-green:#1a2f23; --card-blue:#1b263f; --card-rose:#382126; --card-violet:#2a223f;
    --stripe-none:#3a4352; --stripe-yellow:#e6c33a; --stripe-green:#4cc184; --stripe-blue:#859dff; --stripe-rose:#ff7b86; --stripe-violet:#bb90ff;
    --ok:#52d18c; --warn:#f0b54a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#181d26; --surface-2:#1f252f; --board:#13171e; --grid:#2a3140;
  --text:#e6eaf2; --muted:#9aa5b9; --line:#2c3442; --accent:#859dff; --accent-ink:#0e1117; --accent-weak:#232c49; --danger:#ff7b70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); --shadow-lift:0 2px 4px rgba(0,0,0,.45),0 16px 36px rgba(0,0,0,.5);
  --ink-k:#e6eaf2; --ink-b:#8ea4ff; --ink-r:#ff6d62; --ink-g:#52d18c; --ink-o:#ffa24a; --ink-v:#bb90ff;
  --hl-opacity:.32; --hl-blend:normal;
  --card-none:#181d26; --card-yellow:#36301a; --card-green:#1a2f23; --card-blue:#1b263f; --card-rose:#382126; --card-violet:#2a223f;
  --stripe-none:#3a4352; --stripe-yellow:#e6c33a; --stripe-green:#4cc184; --stripe-blue:#859dff; --stripe-rose:#ff7b86; --stripe-violet:#bb90ff;
  --ok:#52d18c; --warn:#f0b54a;
  color-scheme:dark;
}
/* Präsentation: standardmäßig hell, weil Beamer dunkle Flächen schlucken */
.present.light{
  --bg:#e8ecf3; --surface:#ffffff; --text:#18202e; --muted:#5a667b; --line:#d5dbe6; --accent:#2445c4;
  --ink-k:#18202e; --ink-b:#2445c4; --ink-r:#d1342b; --ink-g:#18864b; --ink-o:#de7410; --ink-v:#7a3fc4; --hl-opacity:.42; --hl-blend:multiply;
  --card-none:#ffffff; --card-yellow:#fff4c4; --card-green:#ddf2e2; --card-blue:#dde7fc; --card-rose:#fbdfdf; --card-violet:#ebe2fa;
  --stripe-none:#c3cbd9; --stripe-yellow:#e6b800; --stripe-green:#2f9d5c; --stripe-blue:#2445c4; --stripe-rose:#d8505a; --stripe-violet:#7a3fc4;
  color-scheme:light;
}
.present.dark{
  --bg:#0e1117; --surface:#181d26; --text:#e6eaf2; --muted:#9aa5b9; --line:#2c3442; --accent:#859dff;
  --ink-k:#e6eaf2; --ink-b:#8ea4ff; --ink-r:#ff6d62; --ink-g:#52d18c; --ink-o:#ffa24a; --ink-v:#bb90ff; --hl-opacity:.32; --hl-blend:normal;
  --card-none:#181d26; --card-yellow:#36301a; --card-green:#1a2f23; --card-blue:#1b263f; --card-rose:#382126; --card-violet:#2a223f;
  --stripe-none:#3a4352; --stripe-yellow:#e6c33a; --stripe-green:#4cc184; --stripe-blue:#859dff; --stripe-rose:#ff7b86; --stripe-violet:#bb90ff;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:block;flex:none}

.app{height:100%;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* ---------- Seitenleiste ---------- */
.sidebar{display:flex;flex-direction:column;min-height:0;background:var(--surface-2);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand .logo{width:28px;height:28px;flex:none}
.brand .grow{flex:1}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;min-height:38px}
.nav-item:hover{background:var(--accent-weak)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:700}
.nav-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-head{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mini-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.empty-note{padding:6px 10px;color:var(--muted);font-size:13px}
.sb-foot{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.foot-row{display:flex;gap:8px}
.foot-row .btn{flex:1}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .dot{background:var(--ok)}
.sync.busy .dot{background:var(--accent);animation:pulse 1s infinite}
.sync.warn .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.scrim{display:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;flex:none}
.icon-btn:hover{background:var(--accent-weak);color:var(--accent)}
.icon-btn.active{background:var(--accent);color:var(--accent-ink)}
.icon-btn:disabled{opacity:.35;pointer-events:none}

/* ---------- Hauptbereich ---------- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.view-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);min-height:56px}
.view-head .grow{flex:1;min-width:0}
.title-input{width:100%;border:1px solid transparent;border-radius:8px;background:transparent;padding:4px 8px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em;min-width:0;text-overflow:ellipsis}
.title-input:hover{border-color:var(--line)}
.title-input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.only-narrow{display:none}
.loading{display:grid;place-items:center;flex:1;color:var(--muted)}

/* ---------- Board ---------- */
.vp-wrap{position:relative;flex:1;min-height:0;overflow:hidden}
.viewport{position:absolute;inset:0;overflow:hidden;background-color:var(--board);background-image:radial-gradient(circle,var(--grid) 1.1px,transparent 1.3px);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
.viewport.tool-pen,.viewport.tool-hl{cursor:crosshair}
.viewport.tool-eraser{cursor:cell}
.viewport.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer-svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.arrow-line{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.arrow-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.arrow.sel .arrow-line{stroke:var(--accent);stroke-width:3}
.hl{fill:none;opacity:var(--hl-opacity);mix-blend-mode:var(--hl-blend);stroke-linecap:round;stroke-linejoin:round}

.bcard{position:absolute;left:0;top:0;border-radius:12px;background:var(--card-none);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;cursor:default}
.bcard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--stripe-none)}
.bcard.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.bcard.dragging{box-shadow:var(--shadow-lift)}
.bcard.connect-src{outline:2.5px dashed var(--accent);outline-offset:3px}
.bcard .cc{padding:16px 16px 14px;pointer-events:none}
.bcard.auto{max-height:540px}
.bcard.clip .fade{position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(transparent,var(--cardbg,var(--card-none)));pointer-events:none}
.bcard-resize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none}
.bcard-resize::after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);opacity:.55}
.c-yellow{--cardbg:var(--card-yellow);background:var(--card-yellow)} .c-yellow::before{background:var(--stripe-yellow) !important}
.c-green{--cardbg:var(--card-green);background:var(--card-green)} .c-green::before{background:var(--stripe-green) !important}
.c-blue{--cardbg:var(--card-blue);background:var(--card-blue)} .c-blue::before{background:var(--stripe-blue) !important}
.c-rose{--cardbg:var(--card-rose);background:var(--card-rose)} .c-rose::before{background:var(--stripe-rose) !important}
.c-violet{--cardbg:var(--card-violet);background:var(--card-violet)} .c-violet::before{background:var(--stripe-violet) !important}

/* Karteninhalt (Board, Bibliothek, Präsentation) */
.cc-title{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.2;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance;overflow-wrap:anywhere}
.cc-title.empty{color:var(--muted);font-weight:500}
.cc-text{overflow-wrap:anywhere}
.cc-text > :first-child,.ed-text > :first-child{margin-top:0}
.cc-text > :last-child,.ed-text > :last-child{margin-bottom:0}
.cc-text h1,.cc-text h2,.cc-text h3,.ed-text h1,.ed-text h2,.ed-text h3{font-family:var(--font-display);font-size:1.15em;margin:.6em 0 .25em;line-height:1.2}
.cc-text p,.ed-text p{margin:.35em 0}
.cc-text ul,.cc-text ol,.ed-text ul,.ed-text ol{margin:.35em 0;padding-left:1.3em}
.cc > * + *{margin-top:10px}
.cc-ink{display:block;width:100%;height:auto;overflow:visible}
.cc-img{display:block;max-width:100%;border-radius:8px}

.toolbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;z-index:5}
.toolbar::-webkit-scrollbar{display:none}
.tb-sep{width:1px;align-self:stretch;margin:4px 4px;background:var(--line);flex:none}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;background:transparent;flex:none;padding:0}
.swatch i{display:block;width:18px;height:18px;border-radius:50%}
.swatch.active{border-color:var(--text)}
.size{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;flex:none;padding:0}
.size i{display:block;border-radius:50%;background:var(--text)}
.size.active{background:var(--accent-weak)}
.zoombar{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5}
.zoombar .pct{min-width:52px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;border:0;background:transparent;padding:6px 2px;border-radius:7px}
.selbar{position:absolute;display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lift);z-index:6;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.selbar .btn{min-height:32px;padding:4px 10px;border-color:transparent;font-size:13px}
.selbar .swatch{width:26px;height:26px}
.selbar .swatch i{width:16px;height:16px;border:1px solid var(--line)}
.board-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:340px;padding:0 16px}
.board-hint b{display:block;font-family:var(--font-display);font-size:18px;color:var(--text);margin-bottom:4px}

/* ---------- Bibliothek ---------- */
.lib-tools{display:flex;gap:8px;align-items:center}
.search{min-width:0;width:240px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:7px 12px}
.search:focus{outline:none;border-color:var(--accent)}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.lcard{position:relative;display:flex;flex-direction:column;height:250px;border-radius:12px;border:1px solid var(--line);background:var(--card-none);box-shadow:var(--shadow);overflow:hidden;text-align:left;padding:0;cursor:pointer}
.lcard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--stripe-none)}
.lcard:hover{box-shadow:var(--shadow-lift)}
.lcard .cc{flex:1;min-height:0;overflow:hidden;padding:16px 14px 0;font-size:13.5px;position:relative}
.lcard .cc-title{font-size:16px}
.lcard .cc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--cardbg,var(--card-none)))}
.lmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip.lone{color:var(--warn);border-color:currentColor;background:transparent}
.lib-empty{color:var(--muted);text-align:center;padding:60px 20px}

/* ---------- Präsentations-Editor ---------- */
.pres-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr)}
.slides-col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.slides-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;font-size:13px;color:var(--muted)}
.slides{list-style:none;margin:0;padding:0 8px 8px;overflow-y:auto;flex:1;touch-action:pan-y}
.slide-row{display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;border:1px solid transparent;background:var(--surface);cursor:pointer;min-height:48px}
.slide-row:hover{background:var(--surface-2)}
.slide-row.active{border-color:var(--accent);background:var(--accent-weak)}
.slide-row.dragging{box-shadow:var(--shadow-lift);position:relative;z-index:2;background:var(--surface)}
.slide-row .grip{display:grid;place-items:center;width:28px;height:36px;color:var(--muted);cursor:grab;touch-action:none;flex:none}
.slide-row .num{width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;flex:none}
.slide-row .sw{width:10px;height:28px;border-radius:3px;background:var(--stripe-none);flex:none}
.slide-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.slide-row .icon-btn{width:30px;height:30px}
.slides-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.preview-col{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;background:var(--bg)}
.preview-frame{position:relative;width:100%;max-width:900px;aspect-ratio:16/10;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.preview-note{color:var(--muted);font-size:13px;text-align:center}

/* ---------- Präsentationsmodus ---------- */
.present{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:none}
.stage{position:absolute;inset:0;overflow:hidden}
.stage.scrolly{overflow-y:auto;touch-action:pan-y}
.slide-holder{position:relative;margin:0 auto}
.slide{position:absolute;left:0;top:0;width:960px;transform-origin:0 0;border-radius:18px;background:var(--card-none);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.slide::before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:var(--stripe-none)}
.slide .cc{padding:48px 56px 52px;font-size:26px;line-height:1.45}
.slide .cc-title{font-size:46px;margin-bottom:22px}
.slide .cc > * + *{margin-top:22px}
.slide .cc-img{border-radius:12px;margin-left:auto;margin-right:auto}
.p-ui{position:absolute;display:flex;align-items:center;gap:6px;transition:opacity .25s;z-index:2}
.present.idle .p-ui{opacity:0;pointer-events:none}
.p-top{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
.p-bottom{bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.p-count{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.p-top .icon-btn{background:var(--surface);border:1px solid var(--line)}
.p-progress{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s;z-index:2}

.editor{width:var(--edw);border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}

.ed-colors .swatch{width:28px;height:28px}

.ed-tools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--surface-2)}

.ed-tools .icon-btn{width:34px;height:34px}
.fmt{font-weight:700;font-size:15px;width:34px;height:34px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.fmt:hover{background:var(--accent-weak);color:var(--accent)}
.ed-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(28px + env(safe-area-inset-bottom))}
.ed-title{width:100%;border:0;background:transparent;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.015em;padding:4px 0 10px;outline:none}
.ed-title::placeholder{color:var(--muted);opacity:.7}
.ed-blocks{display:flex;flex-direction:column;gap:10px}

.blk-ctrl{position:absolute;top:-14px;right:4px;display:flex;gap:2px;padding:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .12s;z-index:2}

.blk-ctrl .icon-btn{width:28px;height:28px}
.ed-text{min-height:1.6em;padding:6px 8px;border-radius:8px;outline:none;font-size:16px;line-height:1.5;-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.ed-text:focus{background:var(--surface-2)}
.ed-text:empty::before{content:attr(data-ph);color:var(--muted);opacity:.75}
.blk-ink{position:relative;border:1px solid var(--line);border-radius:10px;background-color:var(--board);background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 32px;background-position:0 31px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;cursor:crosshair}
body.finger-draw .blk-ink{touch-action:none}
.blk-ink svg{display:block;width:100%;height:auto}
.ink-grow{display:flex;justify-content:center;align-items:center;height:22px;border-top:1px dashed var(--line);color:var(--muted);font-size:12px;cursor:ns-resize;touch-action:none;background:var(--surface)}
.blk-img img{display:block;max-width:100%;border-radius:8px}
.ed-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ed-meta{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.ed-meta .links{display:flex;flex-wrap:wrap;gap:6px}
.ed-meta .chip{cursor:pointer}
.ed-meta .chip:hover{color:var(--accent);border-color:var(--accent)}

.backdrop{position:fixed;inset:0;z-index:80;background:rgba(10,14,24,.42);display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:min(640px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lift);border:1px solid var(--line);overflow:hidden}
.modal h2{font-family:var(--font-display);font-size:19px;margin:0;padding:16px 18px 10px;text-wrap:balance}
.modal p{margin:0;padding:0 18px 8px;color:var(--muted)}
.modal .m-body{flex:1;min-height:0;overflow-y:auto;padding:4px 10px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.modal .search{width:auto;margin:0 18px 8px}
.pick-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:9px;background:transparent;text-align:left;min-height:44px}
.pick-row:hover{background:var(--surface-2)}
.pick-row.on{background:var(--accent-weak)}
.pick-row .sw{width:8px;height:30px;border-radius:3px;background:var(--stripe-none);flex:none}
.pick-row .tt{flex:1;min-width:0}
.pick-row .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-row .tt small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-row .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.pick-row.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.menu{position:fixed;z-index:90;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lift);padding:4px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:9px 12px;border-radius:8px;text-align:left;min-height:40px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Schmale Bildschirme ---------- */
@media (max-width: 1099px){
  .editor{position:fixed;inset:0;z-index:40;width:auto;border-left:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

}

  .title-input{font-size:18px}

  .preview-col{display:none}
  .slides-col{border-right:0}
  .search{width:100%}
  .lib-tools{flex:1}
  .scroll-area{padding:14px}
  .lib-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .lcard{height:210px}
  .toolbar{top:8px}
  .slide .cc{padding:40px 40px 44px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

const ALLOWED_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'H1', 'H2', 'H3', 'P', 'DIV', 'BR', 'UL', 'OL', 'LI', 'SPAN', 'BLOCKQUOTE']);

const isEmptyHtml = html => !htmlToText(html);

// ---------- Datenmodell ----------
const S = { cards: new Map(), boards: new Map(), pres: new Map(), tomb: new Map() };

function newCard(o = {}) {
  return { kind: 'card', id: newId(), title: o.title || '', color: o.color || 'none', created: stamp(), v: stamp(),
    blocks: o.blocks || [{ id: newId(), type: 'text', html: '' }] };
}
function newBoard(name) { return { kind: 'board', id: newId(), name: name || 'Neues Board', created: stamp(), v: stamp(), items: [], arrows: [], ink: [] }; }

function ser(e) {
  if (e.kind === 'card') return {
    kind: 'card', id: e.id, title: e.title, color: e.color, created: e.created, v: e.v,
    blocks: e.blocks.map(b => b.type === 'ink' ? { id: b.id, type: 'ink', h: Math.round(b.h), strokes: b.strokes.map(encStroke) }
      : b.type === 'image' ? { id: b.id, type: 'image', src: b.src, w: b.w, h: b.h }
      : { id: b.id, type: 'text', html: b.html })
  };
  if (e.kind === 'board') return {
    kind: 'board', id: e.id, name: e.name, created: e.created, v: e.v,
    items: e.items.map(i => ({ cardId: i.cardId, x: r2(i.x), y: r2(i.y), w: r2(i.w), h: i.h ? r2(i.h) : null })),
    arrows: e.arrows.map(a => ({ id: a.id, from: a.from, to: a.to })),
    ink: e.ink.map(encStroke)

  if (o.kind === 'card') {
    const blocks = [];
    for (const b of Array.isArray(o.blocks) ? o.blocks : []) {
      if (!b || typeof b !== 'object') continue;
      const id = isId(b.id) ? b.id : newId();
      if (b.type === 'ink') blocks.push({ id, type: 'ink', h: clamp(num(b.h, 300), 80, 6000), strokes: (Array.isArray(b.strokes) ? b.strokes : []).map(decStroke).filter(Boolean) });
      else if (b.type === 'image') { if (typeof b.src === 'string' && /^data:image\/(png|jpe?g|gif|webp);base64,/.test(b.src)) blocks.push({ id, type: 'image', src: b.src, w: num(b.w, 0), h: num(b.h, 0) }); }
      else blocks.push({ id, type: 'text', html: sanitizeHtml(str(b.html, 200000)) });
    }
    return { kind: 'card', ...base, title: str(o.title, 300), color: CARD_COLORS.includes(o.color) ? o.color : 'none', blocks };
  }
  if (o.kind === 'board') {
    return { kind: 'board', ...base, name: str(o.name, 200) || 'Board',
      items: (Array.isArray(o.items) ? o.items : []).filter(i => i && isId(i.cardId)).map(i => ({ cardId: i.cardId, x: num(i.x, 0), y: num(i.y, 0), w: clamp(num(i.w, 300), 160, 1400), h: i.h ? clamp(num(i.h, 200), 80, 4000) : null })),
      arrows: (Array.isArray(o.arrows) ? o.arrows : []).filter(a => a && isId(a.from) && isId(a.to)).map(a => ({ id: isId(a.id) ? a.id : newId(), from: a.from, to: a.to })),

// ---------- Lokaler Zwischenspeicher (IndexedDB, sonst localStorage) ----------
const LocalCache = {
  idb: null, ls: false,
  async open() {

        new Promise((res, rej) => {
          const r = indexedDB.open('kartentisch', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('ents', { keyPath: 'key' });
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        }),
        sleep(2500).then(() => { throw new Error('timeout'); })

    } catch (e) {

    }
  },
  async loadAll() {
    if (this.idb) {
      return new Promise(res => {
        try { const req = this.idb.transaction('ents', 'readonly').objectStore('ents').getAll(); req.onsuccess = () => res(req.result || []); req.onerror = () => res([]); }
        catch (e) { res([]); }
      });
    }
    if (this.ls) {
      const out = [];
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('kt:')) { try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) {} } } } catch (e) {}
      return out;
    }
    return [];
  },
  async putMany(recs) {
    if (!recs.length) return;
    if (this.idb) {
      await new Promise(res => {
        try { const tx = this.idb.transaction('ents', 'readwrite'); const st = tx.objectStore('ents'); for (const r of recs) st.put(r); tx.oncomplete = res; tx.onerror = res; tx.onabort = res; }
        catch (e) { res(); }
      });
    } else if (this.ls) {
      for (const r of recs) { try { localStorage.setItem('kt:' + r.key, JSON.stringify(r)); } catch (e) { /* voll */ } }
    }
  }
};
function recordFor(key) {
  const e = entityByKey(key);
  if (e) return { key, v: e.v, j: JSON.stringify(ser(e)) };
  return { key, v: S.tomb.get(key) || stamp(), d: true };
}
function applyRecord(r) {
  if (!r || typeof r.key !== 'string' || !/^[cbp]_/.test(r.key)) return;
  if ((r.v || 0) <= localV(r.key)) return;
  if (r.d) { removeEntityLocal(r.key, r.v); return; }
  try { const e = deser(JSON.parse(r.j)); if (e && keyOf(e) === r.key) { e.v = r.v; setEntity(e); } } catch (e) {}
}

// ---------- Cloud-Synchronisierung (claude.ai-Datenbank, privat pro Person) ----------
const Persist = {
  mode: 'loading', db: null, userId: null, coll: null, unsub: null,
  dirty: new Set(), localDirty: new Set(), flushing: false, timer: null,
  remoteV: new Map(), remoteN: new Map(), merged: false, reachable: true,
  mark(key) { this.dirty.add(key); this.localDirty.add(key); this.schedule(); updateSync(); },
  schedule(ms = 700) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async flush() {
    const lk = Array.from(this.localDirty); this.localDirty.clear();
    await LocalCache.putMany(lk.map(recordFor));

        try { await this.writeKey(key); this.reachable = true; }

          const code = err && err.code;

          if (code === 'unavailable' || code === 'resource_exhausted' || !code) { this.reachable = false; updateSync(); await sleep(2000 + Math.random() * 2000); }
          else if (code === 'quota_exceeded') { toast('Der Cloud-Speicher ist voll. Lösche große Bilder oder Karten, dann wird weiter synchronisiert.'); break; }
          else { this.goLocal('denied'); break; }

  },
  async writeKey(key) {
    const e = entityByKey(key);
    const coll = this.coll;
    const oldN = this.remoteN.get(key) || 1;
    if (!e) {
      const v = S.tomb.get(key) || stamp();
      await coll.doc(key).set({ k: key.slice(0, 1), v, d: true, n: 1 });
      for (let i = 1; i < oldN; i++) await coll.doc(key + '~' + i).delete();
      this.remoteV.set(key, v); this.remoteN.set(key, 1);
      return;
    }
    const v = e.v; const json = JSON.stringify(ser(e));
    const parts = []; for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
    if (!parts.length) parts.push('');
    for (let i = 1; i < parts.length; i++) await coll.doc(key + '~' + i).set({ j: parts[i], v });
    await coll.doc(key).set({ k: key.slice(0, 1), v, n: parts.length, j: parts[0] });

  onSnap(snap) {

    const changed = new Set();
    for (const [id, body] of byId) {
      if (id.includes('~') || !/^[cbp]_/.test(id) || !body) continue;
      const rv = num(body.v, 0); this.remoteV.set(id, rv); this.remoteN.set(id, num(body.n, 1));
      if (rv <= localV(id)) continue;
      if (body.d) { removeEntityLocal(id, rv); this.localDirty.add(id); changed.add(id); continue; }

        for (const e of all) { const k = keyOf(e); if (e.v > (this.remoteV.get(k) || 0)) this.dirty.add(k); }
        for (const [k, v] of S.tomb) if (v > (this.remoteV.get(k) || 0)) this.dirty.add(k);

  },

    if (first && isEmptyStore()) seedExamples();

    onDataChanged(null); updateSync();
  }
};
function isEmptyStore() { return !S.cards.size && !S.boards.size && !S.pres.size && !S.tomb.size; }

async function connectCloud() {
  let api = null;
  for (let i = 0; i < 30 && !api; i++) { if (window.claude && typeof window.claude.use === 'function') api = window.claude; else await sleep(100); }
  if (!api) { Persist.goLocal('nohost'); return; }
  let db = null, user = null, uid = null;
  try { [db, user] = await Promise.all([api.use('db'), api.use('user')]); } catch (e) {}
  try { uid = user ? await user.id() : null; } catch (e) {}
  if (!db || !uid) { Persist.goLocal('nouser'); return; }
  Persist.db = db; Persist.userId = uid; Persist.mode = 'cloud';
  try { Persist.coll = db.collection('data/users/' + uid); } catch (e) { Persist.goLocal('nouser'); return; }
  updateSync();
  const timer = setTimeout(() => { if (!Persist.merged) { Persist.reachable = false; updateSync(); if (!S.boards.size) onDataChanged(null); } }, 10000);
  Persist.unsub = Persist.coll.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    Persist.onSnap(snap);
  }, err => {
    clearTimeout(timer);
    if (err && err.code === 'unavailable') { Persist.reachable = false; updateSync(); setTimeout(() => { Persist.mode = 'loading'; connectCloud(); }, 5000); }
    else Persist.goLocal('error');
  });
}

function updateSync() {
  const el = $('#sync'), tx = $('#syncText'); if (!el) return;
  el.className = 'sync';
  const pending = Persist.dirty.size > 0 || Persist.flushing;
  if (Persist.mode === 'loading') { tx.textContent = 'Verbinde …'; el.classList.add('busy'); }
  else if (Persist.mode === 'local') {
    tx.textContent = Persist.localReason === 'nohost' ? 'Nur auf diesem Gerät gespeichert' : Persist.localReason === 'nouser' ? 'Nicht angemeldet: nur auf diesem Gerät' : 'Nur auf diesem Gerät gespeichert';
    el.classList.add('warn');
  }
  else if (!Persist.merged || !Persist.reachable) { tx.textContent = Persist.merged ? 'Offline: wird später synchronisiert' : 'Lade aus der Cloud …'; el.classList.add(Persist.merged ? 'warn' : 'busy'); }
  else if (pending) { tx.textContent = 'Speichert …'; el.classList.add('busy'); }
  else { tx.textContent = 'Synchronisiert'; el.classList.add('ok'); }
}

      try { const img = await loadImageFile(f); this.addBlock('image', img); }
      catch (e) { toast('Das Bild konnte nicht gelesen werden. Versuche JPEG oder PNG.'); }
    };
    inp.click();
  },
  bindInk(box, svg, g, live, block) {
    let gest = null, pid = null;
    const local = e => { const r = svg.getBoundingClientRect(); const k = INK_W / r.width; return [(e.clientX - r.left) * k, (e.clientY - r.top) * k, k]; };
    // Stift soll nicht scrollen, Finger schon (außer „Mit Finger zeichnen“)
    box.addEventListener('touchstart', e => { const t = e.touches[0]; if (UI.fingerDraw || (t && t.touchType === 'stylus')) e.preventDefault(); }, { passive: false });
    box.addEventListener('touchmove', e => { if (gest) e.preventDefault(); }, { passive: false });
    box.addEventListener('pointerdown', e => {
      if (gest || !pointerMayDraw(e) || (e.pointerType === 'mouse' && e.button !== 0)) return;
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      try { box.setPointerCapture(e.pointerId); } catch (err) {}
      const [x, y, k] = local(e);
      gest = new InkGesture({ tool: UI.editorTool, layer: live, strokes: block.strokes, scale: k, target: { kind: 'block', cardId: this.cardId, blockId: block.id },
        onDone: st => {
          if (st) { const p = strokeEl(st); st._el = p; g.append(p); if (st.bb[3] > block.h - 70) { block.h = Math.min(6000, block.h + 220); svg.setAttribute('viewBox', `0 0 ${INK_W} ${block.h}`); } }
          const c = S.cards.get(this.cardId); if (c) { touch(c); this.changed(); }
        } });
      pid = e.pointerId; gest.add(x, y, penPressure(e));
    });
    box.addEventListener('pointermove', e => {
      if (!gest || e.pointerId !== pid) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
      for (const ev of (evs && evs.length ? evs : [e])) { const [x, y] = local(ev); gest.add(x, y, penPressure(ev)); }
    });
    const end = (e, cancel) => { if (!gest || e.pointerId !== pid) return; const gg = gest; gest = null; if (cancel) gg.cancel(); else { const [x, y] = local(e); gg.end(x, y); } };
    box.addEventListener('pointerup', e => end(e, false));
    box.addEventListener('pointercancel', e => end(e, true));
  },
  bindGrow(grow, svg, block) {
    let st = null;
    grow.addEventListener('pointerdown', e => { e.preventDefault(); try { grow.setPointerCapture(e.pointerId); } catch (err) {} st = { y: e.clientY, h: block.h, k: INK_W / svg.getBoundingClientRect().width }; });
    grow.addEventListener('pointermove', e => { if (!st) return; block.h = Math.round(clamp(st.h + (e.clientY - st.y) * st.k, 80, 6000)); svg.setAttribute('viewBox', `0 0 ${INK_W} ${block.h}`); });
    const end = () => { if (!st) return; st = null; const c = this.card(); if (c) { touch(c); this.changed(); } };
    grow.addEventListener('pointerup', end); grow.addEventListener('pointercancel', end);
  },
  rerenderInk(cardId, blockId) {
    if (this.cardId !== cardId) return;
    const c = this.card(); const b = c && c.blocks.find(x => x.id === blockId); const el = $(`.blk[data-block="${blockId}"] svg g`, this.blocksEl);
    if (!b || !el) return; el.replaceChildren(); for (const st of b.strokes) { const p = strokeEl(st); st._el = p; el.append(p); }
  },
  onRemoteChange() {
    if (!this.cardId) return;
    if (!S.cards.has(this.cardId)) { this.close(); toast('Diese Karte wurde auf einem anderen Gerät gelöscht.'); return; }
    const ae = document.activeElement; if (ae && $('#editor').contains(ae) && (ae.isContentEditable || ae.tagName === 'INPUT')) { this.stale = true; return; }
    this.render();
  }
};
Editor.textChanged = debounce((b, el) => { const c = Editor.card(); if (!c || !c.blocks.includes(b)) return; b.html = sanitizeHtml(el.innerHTML); b._dirty = false; touch(c); Editor.changed(); }, 350);
Editor.changed = debounce(() => { if (Editor.cardId) refreshCardEverywhere(Editor.cardId, true); }, 250);
function placeCaretEnd(el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

async function loadImageFile(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1400; const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s)), hh = Math.max(1, Math.round(img.naturalHeight * s));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, hh); ctx.drawImage(img, 0, 0, w, hh);
    return { src: cv.toDataURL('image/jpeg', 0.82), w, h: hh };
  } finally { URL.revokeObjectURL(url); }
}

// ---------- Karten löschen / Präsentation hinzufügen ----------
async function deleteCardEverywhere(cardId) {
  const c = S.cards.get(cardId); if (!c) return;
  const nb = boardsWithCard(cardId).length, np = presWithCard(cardId).length;
  const where = [nb ? (nb === 1 ? '1 Board' : nb + ' Boards') : '', np ? (np === 1 ? '1 Präsentation' : np + ' Präsentationen') : ''].filter(Boolean).join(' und ');
  if (!(await confirmDialog(`„${cardTitle(c)}“ löschen?`, where ? `Die Karte verschwindet auch von ${where}.` : 'Die Karte wird endgültig gelöscht.', 'Karte löschen'))) return;
  for (const b of S.boards.values()) {
    if (b.items.some(i => i.cardId === cardId) || b.arrows.some(a => a.from === cardId || a.to === cardId)) {
      b.items = b.items.filter(i => i.cardId !== cardId); b.arrows = b.arrows.filter(a => a.from !== cardId && a.to !== cardId); touch(b);
    }
  }
  for (const p of S.pres.values()) if (p.cardIds.includes(cardId)) { p.cardIds = p.cardIds.filter(id => id !== cardId); touch(p); }
  removeEntityLocal('c_' + cardId, stamp()); Persist.mark('c_' + cardId);
  if (Editor.cardId === cardId) Editor.close();
  if (UI.sel && UI.sel.id === cardId) UI.sel = null;
  onDataChanged(null);
}
async function addCardsToPresentation(cardIds) {
  const list = sortedPres();
  const choice = await chooseDialog('Zu welcher Präsentation?', [...list.map(p => ({ value: p.id, label: p.name, sub: `${p.cardIds.length} Folien` })), { value: '__new', label: '+ Neue Präsentation', sub: '' }]);
  if (!choice) return;
  let p;
  if (choice === '__new') { p = newPres(); setEntity(p); } else p = S.pres.get(choice);
  if (!p) return;
  const add = cardIds.filter(id => !p.cardIds.includes(id));
  p.cardIds.push(...add); touch(p); renderSidebarSoon();
  if (Editor.cardId) Editor.renderMeta();
  if (PresView.presId === p.id && UI.view.type === 'pres') PresView.render();
  toast(add.length ? `Zu „${p.name}“ hinzugefügt (Folie ${p.cardIds.length})` : `Ist schon in „${p.name}“`);
}

// ---------- Dialoge und Menüs ----------
function modal(build) {
  return new Promise(resolve => {
    const root = $('#modalRoot'); const prevFocus = document.activeElement;
    const done = v => { root.replaceChildren(); document.removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) try { prevFocus.focus({ preventScroll: true }); } catch (e) {} resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); done(null); } };
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
    const back = h('div', { class: 'backdrop', onpointerdown: e => { if (e.target === back) done(null); } }, box);
    build(box, done);
    root.replaceChildren(back); document.addEventListener('keydown', onKey, true);
    const f = box.querySelector('[data-autofocus]') || box.querySelector('input,button'); if (f) setTimeout(() => f.focus(), 20);
  });
}
function confirmDialog(title, text, okLabel) {
  return modal((box, done) => {
    box.append(h('h2', { text: title }), h('p', { text }),
      h('div', { class: 'm-foot' }, h('button', { class: 'btn', type: 'button', text: 'Abbrechen', onclick: () => done(false) }),
        h('button', { class: 'btn primary', type: 'button', 'data-autofocus': true, style: 'background:var(--danger);border-color:var(--danger)', text: okLabel, onclick: () => done(true) })));
  }).then(v => !!v);
}
function chooseDialog(title, options) {
  return modal((box, done) => {
    const body = h('div', { class: 'm-body' });
    for (const o of options) body.append(h('button', { class: 'pick-row', type: 'button', onclick: () => done(o.value) }, h('span', { class: 'tt' }, h('b', { text: o.label }), o.sub ? h('small', { text: o.sub }) : null)));
    box.append(h('h2', { text: title }), body, h('div', { class: 'm-foot' }, h('button', { class: 'btn', type: 'button', text: 'Abbrechen', onclick: () => done(null) })));
  });
}
function pickCards({ title, multi, exclude, okLabel }) {
  return modal((box, done) => {
    const chosen = new Set();
    const search = h('input', { class: 'search', type: 'search', placeholder: 'Suchen', 'aria-label': 'Karten suchen', 'data-autofocus': true });
    const body = h('div', { class: 'm-body' });
    const ok = h('button', { class: 'btn primary', type: 'button', text: okLabel, disabled: true, onclick: () => done([...chosen]) });
    const render = () => {
      const q = search.value.trim().toLowerCase();
      const cards = [...S.cards.values()].filter(c => !exclude || !exclude.has(c.id)).sort((a, b) => b.v - a.v)
        .filter(c => !q || (c.title + ' ' + cardSnippet(c)).toLowerCase().includes(q));
      body.replaceChildren();
      if (!cards.length) body.append(h('div', { class: 'empty-note', style: 'padding:16px', text: q ? 'Keine passende Karte.' : 'Keine weiteren Karten in der Bibliothek.' }));
      for (const c of cards) {
        const sw = h('span', { class: 'sw' }); sw.style.background = `var(--stripe-${c.color})`;
        const row = h('button', { class: 'pick-row' + (chosen.has(c.id) ? ' on' : ''), type: 'button', 'aria-pressed': chosen.has(c.id) ? 'true' : 'false',
          onclick: () => { if (!multi) { done([c.id]); return; } if (chosen.has(c.id)) chosen.delete(c.id); else chosen.add(c.id); ok.disabled = !chosen.size; ok.textContent = chosen.size ? `${okLabel} (${chosen.size})` : okLabel; render(); } },
          sw, h('span', { class: 'tt' }, h('b', { text: cardTitle(c) }), h('small', { text: cardSnippet(c) })), multi ? h('span', { class: 'box', html: chosen.has(c.id) ? icon('check', 14) : '' }) : null);
        body.append(row);
      }
    };
    search.addEventListener('input', render);
    box.append(h('h2', { text: title }), search, body, h('div', { class: 'm-foot' }, h('button', { class: 'btn', type: 'button', text: 'Abbrechen', onclick: () => done(null) }), multi ? ok : null));
    render();
  });
}
function openMenu(anchor, items) {
  const root = $('#modalRoot');
  const close = () => { root.replaceChildren(); document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', esc, true); };
  const outside = e => { if (!menu.contains(e.target)) close(); };
  const esc = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  const menu = h('div', { class: 'menu', role: 'menu' });
  for (const it of items) menu.append(h('button', { type: 'button', role: 'menuitem', class: it.danger ? 'danger' : '', text: it.label, onclick: () => { close(); it.onClick(); } }));
  root.replaceChildren(menu);
  const r = anchor.getBoundingClientRect(); const mw = menu.offsetWidth;
  menu.style.top = (r.bottom + 6) + 'px'; menu.style.left = clamp(r.right - mw, 8, innerWidth - mw - 8) + 'px';
  setTimeout(() => { document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', esc, true); const f = menu.querySelector('button'); if (f) f.focus(); }, 0);
}

// ---------- Seitenleiste & Navigation ----------
function menuButton() { return iconBtn('menu', 'Seitenleiste öffnen', () => toggleSidebar(true), 'only-narrow'); }
function toggleSidebar(open) { $('#sidebar').classList.toggle('open', open); $('#scrim').classList.toggle('open', open); }
function renderSidebar() {
  const bl = $('#boardList'), pl = $('#presList');
  const v = UI.view || {};
  bl.replaceChildren(); pl.replaceChildren();
  const boards = sortedBoards(), pres = sortedPres();
  if (!boards.length) bl.append(h('div', { class: 'empty-note', text: 'Noch kein Board' }));
  for (const b of boards) bl.append(h('button', { class: 'nav-item' + (v.type === 'board' && v.id === b.id ? ' active' : ''), type: 'button', onclick: () => navigate({ type: 'board', id: b.id }), html: icon('board', 18) },
    h('span', { class: 'lbl', text: b.name || 'Ohne Namen' }), h('span', { class: 'count', text: String(b.items.length) })));
  if (!pres.length) pl.append(h('div', { class: 'empty-note', text: 'Noch keine Präsentation' }));
  for (const p of pres) pl.append(h('button', { class: 'nav-item' + (v.type === 'pres' && v.id === p.id ? ' active' : ''), type: 'button', onclick: () => navigate({ type: 'pres', id: p.id }), html: icon('present', 18) },
    h('span', { class: 'lbl', text: p.name || 'Ohne Namen' }), h('span', { class: 'count', text: String(p.cardIds.filter(id => S.cards.has(id)).length) })));
  $('#navLibrary').classList.toggle('active', v.type === 'library');
  $('#cardCount').textContent = String(S.cards.size);
}
const renderSidebarSoon = debounce(renderSidebar, 120);
function navigate(view) {
  if (!resolveView(view)) view = sortedBoards()[0] ? { type: 'board', id: sortedBoards()[0].id } : { type: 'library' };
  UI.view = view; UI.sel = null; saveUiPrefs(); toggleSidebar(false);
  if (view.type !== 'board') BV.unmount();
  if (view.type !== 'pres') PresView.presId = null;
  if (view.type !== 'library') LibView.grid = null;
  if (view.type === 'board') BV.mount(view.id);
  else if (view.type === 'pres') PresView.mount(view.id);
  else LibView.mount();
  renderSidebar();
  if (Editor.cardId) Editor.renderMeta();
}
function refreshCardEverywhere(cardId, light) {
  if (UI.view && UI.view.type === 'board' && BV.root) BV.refreshCard(cardId);
  if (UI.view && UI.view.type === 'library' && LibView.grid) { if (!light) LibView.renderGrid(); else refreshLibSoon(); }
  if (UI.view && UI.view.type === 'pres' && PresView.presId) refreshPresSoon();
  renderSidebarSoon();
}
const refreshLibSoon = debounce(() => LibView.grid && LibView.renderGrid(), 600);
const refreshPresSoon = debounce(() => PresView.presId && PresView.render(), 400);
function onDataChanged(changed) {
  // Ansicht nach (entfernten) Änderungen aktualisieren
  if (!UI.view || !resolveView(UI.view)) { navigate(UI.view); return; }
  if ($('#main .loading')) { navigate(UI.view); return; }
  const v = UI.view;
  if (v.type === 'board' && BV.root) {
    if (!changed || changed.has('b_' + v.id) || [...changed].some(k => k.startsWith('c_'))) {
      BV.renderCards(); BV.renderInk(); requestAnimationFrame(() => { BV.renderArrows(); BV.positionSelbar(); });
      const n = $('#boardName'); const b = BV.board(); if (n && b && document.activeElement !== n) n.value = b.name;
    }
  } else if (v.type === 'pres' && PresView.presId) PresView.render();
  else if (v.type === 'library') LibView.renderGrid();
  renderSidebar();
  if (Editor.cardId && (!changed || changed.has('c_' + Editor.cardId))) Editor.onRemoteChange();
  else if (Editor.cardId) Editor.renderMeta();
  if (Presenter.active() && changed) Presenter.render();
}

// ---------- Export / Import ----------
async function exportData() {
  Editor.flushText();
  const data = { app: 'kartentisch', version: 1, exported: new Date().toISOString(),
    cards: [...S.cards.values()].map(ser), boards: [...S.boards.values()].map(ser), presentations: [...S.pres.values()].map(ser) };
  const json = JSON.stringify(data);
  const filename = `kartentisch-${new Date().toISOString().slice(0, 10)}.json`;
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data: json }); toast('Sicherung gespeichert'); return; }
    catch (e) { if (e && (e.code === 'cancelled' || e.code === 'declined' || e.code === 'denied')) return; }
  }
  // Ersatzweg außerhalb von claude.ai: normaler Download
  try {
    const a = h('a', { href: URL.createObjectURL(new Blob([json], { type: 'application/json' })), download: filename });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('Export ist in dieser Ansicht nicht möglich.'); }
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let o; try { o = JSON.parse(fr.result); } catch (e) { toast('Diese Datei ist keine Kartentisch-Sicherung.'); return; }
    if (!o || o.app !== 'kartentisch') { toast('Diese Datei ist keine Kartentisch-Sicherung.'); return; }
    let n = 0;
    for (const raw of [...(o.cards || []), ...(o.boards || []), ...(o.presentations || [])]) {
      const e = deser(raw); if (!e) continue;
      const k = keyOf(e); if (e.v <= localV(k) && entityByKey(k)) continue;
      e.v = Math.max(e.v, localV(k) + 1); setEntity(e); Persist.mark(k); n++;
    }
    toast(n ? `${n} Einträge importiert` : 'Nichts Neues in dieser Datei'); onDataChanged(null);
  };
  fr.readAsText(file);
}

// ---------- Tastatur ----------
document.addEventListener('keydown', e => {
  if ($('#modalRoot').firstChild) return;
  if (Presenter.active()) { Presenter.onKey(e); return; }
  const ae = document.activeElement; const typing = ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  if (e.key === 'Escape' && Editor.cardId) { if (typing) ae.blur(); Editor.close(); e.preventDefault(); return; }
  if (typing) return;
  if (Editor.cardId && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) Undo.redo(); else Undo.undo(); return; }
  if (UI.view && UI.view.type === 'board' && BV.root) BV.onKey(e);
});

// ---------- Start ----------
function buildShell() {
  $('#sbClose').innerHTML = icon('close');
  $('#sbClose').addEventListener('click', () => toggleSidebar(false));
  $('#scrim').addEventListener('click', () => toggleSidebar(false));
  $('#libIcon').innerHTML = icon('cards', 18);
  $('#newBoard').innerHTML = icon('plus', 16);
  $('#newPres').innerHTML = icon('plus', 16);
  $('#navLibrary').addEventListener('click', () => navigate({ type: 'library' }));
  $('#newBoard').addEventListener('click', () => { const b = newBoard('Neues Board ' + (S.boards.size + 1)); setEntity(b); touch(b); navigate({ type: 'board', id: b.id }); setTimeout(() => { const n = $('#boardName'); if (n) { n.focus(); n.select(); } }, 50); });
  $('#newPres').addEventListener('click', () => { const p = newPres('Neue Präsentation ' + (S.pres.size + 1)); setEntity(p); touch(p); navigate({ type: 'pres', id: p.id }); });
  const fd = $('#fingerDraw'); fd.checked = UI.fingerDraw;
  document.body.classList.toggle('finger-draw', UI.fingerDraw);
  fd.addEventListener('change', () => { UI.fingerDraw = fd.checked; document.body.classList.toggle('finger-draw', UI.fingerDraw); saveUiPrefs(); toast(UI.fingerDraw ? 'Der Finger zeichnet jetzt. Mit zwei Fingern verschieben und zoomen.' : 'Nur der Apple Pencil zeichnet. Der Finger verschiebt.'); });
  $('#exportBtn').addEventListener('click', exportData);
  $('#importBtn').addEventListener('click', () => { const f = $('#importFile'); f.value = ''; f.click(); });
  $('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importData(f); });
  addEventListener('resize', debounce(() => { if (BV.root) { BV.positionSelbar(); } if (PresView.presId && UI.view.type === 'pres') PresView.render(); }, 150));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { Editor.flushText(); Persist.flush(); } });
  addEventListener('pagehide', () => { Editor.flushText(); Persist.flush(); });
  document.addEventListener('focusout', () => { if (Editor.stale && !$('#editor').contains(document.activeElement)) { Editor.stale = false; setTimeout(() => { if (Editor.cardId) Editor.render(); }, 0); } });
}
async function boot() {
  loadUiPrefs(); buildShell(); updateSync();
  await LocalCache.open();
  const recs = await LocalCache.loadAll();
  for (const r of recs) applyRecord(r);
  if (!isEmptyStore()) navigate(UI.view);
  renderSidebar();
  connectCloud();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (BV.root) BV.arrowsSoon(); });
}
boot();
